<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1219" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, self-hosted journal." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="微日记" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wei Journal</title>
    <script>
      // Theme and language are applied before the first paint, so a dark
      // journal never opens with a light flash.
      ;(function () {
        try {
          var root = document.documentElement
          var choice = localStorage.getItem('wj.theme')
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (choice === 'dark' || choice === 'light') root.setAttribute('data-theme', choice)
          var color = dark ? '#0d1219' : '#edeff2'
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i += 1) metas[i].setAttribute('content', color)
          if (localStorage.getItem('wj.language') === 'zh-CN') {
            root.lang = 'zh-Hans'
            document.title = '微日记'
          }
          if (window.navigator.standalone) root.setAttribute('data-standalone', '')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
