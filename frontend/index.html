<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A private, self-hosted journal for words, images and memories." />
    <!-- Home-screen launch. The viewport already uses viewport-fit=cover, and
         black-translucent lets the page run under the status bar. iOS still
         draws the status bar and the Home Indicator; a site cannot hide them. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="微日记" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wei Journal</title>
    <script>
      // The account's theme is read before the first paint, so a dark
      // journal never opens with a white flash.
      (function () {
        try {
          var choice = window.localStorage.getItem('wj.theme')
          if (choice === 'dark' || choice === 'light') {
            document.documentElement.setAttribute('data-theme', choice)
            var color = choice === 'dark' ? '#000000' : '#f2f2f7'
            var metas = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < metas.length; i += 1) metas[i].setAttribute('content', color)
          }
          if (window.localStorage.getItem('wj.language') === 'zh-CN') {
            document.documentElement.lang = 'zh-Hans'
          }
        } catch (error) {
          // Storage can be refused; the system theme is a fine default.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
