server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The application limits uploads with WJ_MAX_UPLOAD_MB (256 MB by
    # default). This value must stay at or above that limit, otherwise nginx
    # rejects the request before the backend can return a proper error.
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Uploaded originals and derived assets are never served from here. They
    # live outside the web root and are only reachable through the
    # authenticated /api/media endpoints of the backend.

    location /assets/ {
        # Vite emits content hashed file names, so they can be cached
        # indefinitely.
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        # The entry document must never be cached, otherwise a new release
        # keeps serving references to assets that no longer exist.
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        expires 0;
    }

    location / {
        # Single page application: every unknown path is a client route.
        # The internal redirect lands on the location above, which carries
        # the security headers.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Media downloads can be large and the backend supports range
        # requests, so the response is streamed rather than buffered.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 512m;

        # The backend sets X-Content-Type-Options, X-Frame-Options,
        # Referrer-Policy and Permissions-Policy on every API response, so
        # nginx does not add a second copy of them here.
    }
}
